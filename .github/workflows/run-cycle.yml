name: Run agent cycle

# Vercel's free Hobby plan only allows a cron job once per day, so this
# workflow is the real heartbeat: it pings the deployed app every 10 minutes
# so the desk actually runs through market hours instead of once a day.
# GitHub Actions schedules are best-effort and can slip a few minutes under
# load — that's fine for a research/paper desk, not something to rely on
# for anything time-critical.
#
# The deploy URL below is a public URL (not a secret) baked in as a default
# so this works out of the box. If you ever redeploy to a different URL,
# either edit DEFAULT_DEPLOY_URL below or add a repository secret named
# DEPLOY_URL (Settings -> Secrets and variables -> Actions) — the secret,
# if set, takes priority.

env:
  DEFAULT_DEPLOY_URL: "https://obsidian-desk-live-suzi3.vercel.app"

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cycle
        run: |
          URL="${{ secrets.DEPLOY_URL }}"
          if [ -z "$URL" ]; then
            URL="$DEFAULT_DEPLOY_URL"
          fi
          curl -sS -X POST "$URL/api/cycle" -o - -w "\nHTTP %{http_code}\n"
